{% set name = "deffcode" %}
{% set version = "0.2.7" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/deffcode-{{ version }}.tar.gz
  sha256: c083f625291667f9794a3b3e53b16a46c14197ac36b1e443587b544c9ae0abea

build:
  skip: true  # [py<38]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
  host:
    - python
    - pip
    - setuptools
  run:
    - python
    - cython
    - numpy
    - requests
    - colorlog
    - tqdm

test:
  imports:
    - deffcode
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://abhitronix.github.io/deffcode
  summary: A cross-platform High-performance & Flexible Real-time Video Frames Decoder in Python.
  dev_url: https://github.com/abhiTronix/deffcode
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - roaldarbol
