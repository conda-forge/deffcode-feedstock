{% set name = "deffcode" %}
{% set version = "0.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/deffcode-{{ version }}.tar.gz
  sha256: f90971ff1337d5cf74e795017d3036af0fcc4d066433433200f1ddb4de944a71

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=61.0
  run:
    - python >={{ python_min }}
    - cython
    - numpy
    - requests
    - colorlog
    - tqdm
    - ffmpeg

test:
  imports:
    - deffcode
  commands:
    - pip check
    # on Linux and macOS, deffcode uses the ffmpeg on PATH
    - python -c "import sys; from deffcode.ffhelper import get_valid_ffmpeg_path; sys.exit(0 if get_valid_ffmpeg_path() else 1)"  # [unix]
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://abhitronix.github.io/deffcode
  summary: A cross-platform High-performance & Flexible Real-time Video Frames Decoder in Python.
  dev_url: https://github.com/abhiTronix/deffcode
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - roaldarbol
